<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ page_title|default:"Analytics" }} - BB Cosmetics</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #f8fafc;
            color: #1e293b;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .navbar-wrapper {
            position: sticky;
            top: 0;
            z-index: 100;
        }

        /* Primary Dark Top Navbar */
        .navbar {
            background-color: #0f172a;
            color: #f8fafc;
            height: 60px;
            border-bottom: 1px solid #1e293b;
        }

        .navbar-container {
            max-width: 1280px;
            height: 100%;
            margin: 0 auto;
            padding: 0 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
        }

        .navbar-brand {
            font-size: 1.05rem;
            font-weight: 700;
            color: #ffffff;
            text-decoration: none;
            letter-spacing: 0.2px;
        }

        .navbar-nav {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .nav-link {
            padding: 8px 10px;
            border-radius: 6px;
            color: #cbd5e1;
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: 500;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            transition: background-color 0.15s, color 0.15s;
        }

        .nav-link:hover {
            background-color: #1e293b;
            color: #ffffff;
        }

        .nav-link.active {
            background-color: #334155;
            color: #ffffff;
            font-weight: 600;
        }

        .navbar-page-label {
            font-size: 0.82rem;
            color: #94a3b8;
            font-weight: 500;
        }

        /* Secondary Product Filter Navbar */
        .filter-navbar {
            background-color: #ffffff;
            border-bottom: 1px solid #e2e8f0;
            height: 44px;
        }

        .filter-navbar-container {
            max-width: 1280px;
            height: 100%;
            margin: 0 auto;
            padding: 0 24px;
            display: flex;
            align-items: center;
            gap: 8px;
            overflow-x: auto;
            scrollbar-width: none;
        }

        .filter-navbar-container::-webkit-scrollbar {
            display: none;
        }

        .filter-link {
            padding: 5px 12px;
            border-radius: 999px;
            color: #475569;
            text-decoration: none;
            font-size: 0.82rem;
            font-weight: 500;
            white-space: nowrap;
            transition: background-color 0.15s, color 0.15s;
        }

        .filter-link:hover {
            background-color: #f1f5f9;
            color: #0f172a;
        }

        .filter-link.active {
            background-color: #0f172a;
            color: #ffffff;
            font-weight: 600;
        }

        /* Main Wrapper & Content Area */
        .main-wrapper {
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        .content {
            flex: 1;
            width: 100%;
            max-width: 1280px;
            margin: 0 auto;
            padding: 24px;
        }

        .card {
            background: #ffffff;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            padding: 20px;
        }

        .card h2 {
            font-size: 1rem;
            margin-bottom: 6px;
        }

        .card p {
            color: #64748b;
            font-size: 0.9rem;
        }

        /* Footer */
        .footer {
            background-color: #ffffff;
            border-top: 1px solid #e2e8f0;
            padding: 14px 24px;
            font-size: 0.82rem;
            color: #64748b;
            text-align: center;
        }

        @media (max-width: 640px) {
            .navbar-page-label {
                display: none;
            }

            .navbar-container,
            .filter-navbar-container {
                padding: 0 14px;
            }

            .content {
                padding: 16px;
            }
        }
    </style>
</head>

<body>

    <div class="main-wrapper">
        {% include 'Layout/Header.html' %}

        <main class="content">
            {% block content %}{% endblock %}
        </main>

        {% include 'Layout/Footer.html' %}
    </div>

</body>

</html>
