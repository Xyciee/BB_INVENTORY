<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ page_title|default:"POS & Inventory" }} • BABY BRIGHT</title>

    <!-- Google Fonts: Plus Jakarta Sans & JetBrains Mono -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">

    <style>
        :root {
            --font-main: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            --font-mono: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
            
            --primary: #0f172a;
            --primary-hover: #1e293b;
            --primary-light: #334155;
            
            --accent: #2563eb;
            --accent-hover: #1d4ed8;
            --accent-subtle: #eff6ff;
            
            --rose: #e11d48;
            --rose-subtle: #fff1f2;
            
            --emerald: #059669;
            --emerald-subtle: #ecfdf5;
            
            --amber: #d97706;
            --amber-subtle: #fffbeb;
            
            --bg-page: #f8fafc;
            --bg-card: #ffffff;
            --border: #e2e8f0;
            --border-hover: #cbd5e1;
            
            --text-main: #0f172a;
            --text-secondary: #475569;
            --text-muted: #64748b;
            --text-light: #94a3b8;
            
            --shadow-xs: 0 1px 2px 0 rgba(15, 23, 42, 0.05);
            --shadow-sm: 0 1px 3px 0 rgba(15, 23, 42, 0.06), 0 1px 2px -1px rgba(15, 23, 42, 0.06);
            --shadow-md: 0 4px 6px -1px rgba(15, 23, 42, 0.07), 0 2px 4px -2px rgba(15, 23, 42, 0.05);
            --shadow-lg: 0 10px 15px -3px rgba(15, 23, 42, 0.08), 0 4px 6px -4px rgba(15, 23, 42, 0.04);
            --shadow-xl: 0 20px 25px -5px rgba(15, 23, 42, 0.1), 0 8px 10px -6px rgba(15, 23, 42, 0.04);
            
            --radius-sm: 8px;
            --radius-md: 12px;
            --radius-lg: 16px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: var(--font-main);
            background-color: var(--bg-page);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        .navbar-wrapper {
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: 0 4px 20px -2px rgba(15, 23, 42, 0.08);
        }

        /* Primary Dark Top Navbar */
        .navbar {
            background-color: #0b1120;
            color: #f8fafc;
            height: 62px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        }

        .navbar-container {
            max-width: 1340px;
            height: 100%;
            margin: 0 auto;
            padding: 0 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
        }

        .navbar-brand {
            display: flex;
            align-items: center;
            gap: 10px;
            text-decoration: none;
        }

        .navbar-brand-title {
            font-size: 1.15rem;
            font-weight: 800;
            color: #ffffff;
            letter-spacing: -0.02em;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .navbar-brand-badge {
            background: rgba(225, 29, 72, 0.18);
            color: #fda4af;
            border: 1px solid rgba(225, 29, 72, 0.35);
            font-size: 0.65rem;
            font-weight: 700;
            letter-spacing: 0.6px;
            padding: 2px 7px;
            border-radius: 999px;
            text-transform: uppercase;
        }

        .navbar-nav {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .nav-link {
            padding: 8px 14px;
            border-radius: 8px;
            color: #94a3b8;
            text-decoration: none;
            font-size: 0.88rem;
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            gap: 7px;
            transition: all 0.15s ease;
            border: 1px solid transparent;
        }

        .nav-link:hover {
            background-color: rgba(255, 255, 255, 0.06);
            color: #ffffff;
        }

        .nav-link.active {
            background-color: #1e293b;
            color: #ffffff;
            border-color: rgba(255, 255, 255, 0.12);
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
        }

        .nav-link-icon {
            font-size: 1.05rem;
            line-height: 1;
        }

        /* Secondary Product Filter Navbar */
        .filter-navbar {
            background-color: #ffffff;
            border-bottom: 1px solid var(--border);
            height: 48px;
        }

        .filter-navbar-container {
            max-width: 1340px;
            height: 100%;
            margin: 0 auto;
            padding: 0 24px;
            display: flex;
            align-items: center;
            gap: 8px;
            overflow-x: auto;
            scrollbar-width: none;
        }

        .filter-navbar-container::-webkit-scrollbar {
            display: none;
        }

        .filter-link {
            padding: 6px 14px;
            border-radius: 999px;
            color: var(--text-secondary);
            text-decoration: none;
            font-size: 0.8rem;
            font-weight: 600;
            white-space: nowrap;
            transition: all 0.15s ease;
            letter-spacing: 0.2px;
            border: 1px solid transparent;
        }

        .filter-link:hover {
            background-color: #f1f5f9;
            color: var(--text-main);
        }

        .filter-link.active {
            background-color: #0f172a;
            color: #ffffff;
            box-shadow: 0 2px 6px rgba(15, 23, 42, 0.15);
        }

        /* Main Wrapper & Content Area */
        .main-wrapper {
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        .content {
            flex: 1;
            width: 100%;
            max-width: 1340px;
            margin: 0 auto;
            padding: 24px;
        }

        /* Notifications & Alert Banners */
        .toast-banner {
            padding: 12px 18px;
            border-radius: var(--radius-sm);
            font-weight: 500;
            font-size: 0.9rem;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: var(--shadow-sm);
            animation: slideDown 0.2s ease-out;
        }

        @keyframes slideDown {
            from { transform: translateY(-6px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        .toast-success {
            background: #f0fdf4;
            color: #166534;
            border: 1px solid #bbf7d0;
        }

        .toast-error {
            background: #fef2f2;
            color: #991b1b;
            border: 1px solid #fecaca;
        }

        .toast-close-btn {
            background: none;
            border: none;
            font-size: 1.25rem;
            line-height: 1;
            cursor: pointer;
            color: inherit;
            padding: 0 4px;
            opacity: 0.7;
            transition: opacity 0.15s;
        }

        .toast-close-btn:hover {
            opacity: 1;
        }

        /* Footer */
        .footer {
            background-color: #ffffff;
            border-top: 1px solid var(--border);
            padding: 16px 24px;
            font-size: 0.82rem;
            color: var(--text-muted);
            display: flex;
            align-items: center;
            justify-content: space-between;
            max-width: 1340px;
            margin: 0 auto;
            width: 100%;
        }

        .system-status-indicator {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-weight: 600;
            color: #059669;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background-color: #10b981;
            box-shadow: 0 0 0 2px rgba(16, 185, 129, 0.2);
            animation: pulseDot 2s infinite;
        }

        @keyframes pulseDot {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.4; }
        }

        @media (max-width: 768px) {
            .navbar-container,
            .filter-navbar-container {
                padding: 0 16px;
            }

            .content {
                padding: 16px;
            }

            .footer {
                flex-direction: column;
                gap: 8px;
                text-align: center;
            }
        }
    </style>
</head>

<body>

    <div class="main-wrapper">
        {% include 'Layout/Header.html' %}

        <main class="content">
            {% if messages %}
            <div>
                {% for message in messages %}
                <div class="toast-banner {% if message.tags == 'error' %}toast-error{% else %}toast-success{% endif %}">
                    <div style="display: flex; align-items: center; gap: 8px;">
                        <span>{% if message.tags == 'error' %}⚠️{% else %}✅{% endif %}</span>
                        <span>{{ message }}</span>
                    </div>
                    <button type="button" class="toast-close-btn" onclick="this.parentElement.remove()">&times;</button>
                </div>
                {% endfor %}
            </div>
            {% endif %}
            {% block content %}{% endblock %}
        </main>

        {% include 'Layout/Footer.html' %}
    </div>

</body>

</html>
