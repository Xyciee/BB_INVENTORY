<header class="navbar-wrapper">
    <!-- Primary Dark Navbar -->
    <div class="navbar">
        <div class="navbar-container">
            <a href="{% url 'analytics' %}" class="navbar-brand">
                <span class="navbar-brand-title">
                    BABY BRIGHT
                </span>
                <span class="navbar-brand-badge">POS &amp; Retail</span>
            </a>

            <nav class="navbar-nav" id="navbarNav">
                <a href="{% url 'analytics' %}" class="nav-link {% if current_page == 'analytics' %}active{% endif %}"
                    title="Point of Sale &amp; Catalog">
                    <span class="nav-link-icon">🛒</span>
                    <span>POS / Catalog</span>
                </a>
                <a href="{% url 'inventory' %}" class="nav-link {% if current_page == 'inventory' %}active{% endif %}"
                    title="Inventory Database">
                    <span class="nav-link-icon">📦</span>
                    <span>Inventory</span>
                </a>
                <a href="{% url 'sales' %}" class="nav-link {% if current_page == 'sales' %}active{% endif %}"
                    title="Sales Records &amp; Analytics">
                    <span class="nav-link-icon">📈</span>
                    <span>Sales Records</span>
                </a>
            </nav>
        </div>
    </div>

    <!-- Secondary Product Filter Navbar (Shown on POS and Inventory) -->
    {% if current_page != 'sales' %}
    {% with selected_cat=request.GET.category|default:"all" %}
    <div class="filter-navbar">
        <div class="filter-navbar-container">
            <a href="?category=all" class="filter-link {% if selected_cat == 'all' %}active{% endif %}">✨ ALL ITEMS</a>
            <a href="?category=lips" class="filter-link {% if selected_cat == 'lips' %}active{% endif %}">💄 LIPS</a>
            <a href="?category=face" class="filter-link {% if selected_cat == 'face' %}active{% endif %}">✨ FACE</a>
            <a href="?category=eyes" class="filter-link {% if selected_cat == 'eyes' %}active{% endif %}">👁️ EYES</a>
            <a href="?category=bath_and_body"
                class="filter-link {% if selected_cat == 'bath_and_body' %}active{% endif %}">🧴 BATH AND BODY</a>
            <a href="?category=fragrance"
                class="filter-link {% if selected_cat == 'fragrance' %}active{% endif %}">🌸 FRAGRANCE</a>
        </div>
    </div>
    {% endwith %}
    {% endif %}
</header>
