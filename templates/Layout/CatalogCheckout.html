<style>
    .pos-layout {
        display: grid;
        grid-template-columns: 1fr 350px;
        gap: 24px;
        align-items: start;
    }

    @media (max-width: 960px) {
        .pos-layout {
            grid-template-columns: 1fr;
        }
    }

    /* Product Cards Grid */
    .products-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(205px, 1fr));
        gap: 16px;
    }

    .product-card {
        background: #ffffff;
        border: 1px solid #e2e8f0;
        border-radius: 10px;
        overflow: hidden;
        display: flex;
        flex-direction: column;
        transition: transform 0.15s ease, box-shadow 0.15s ease, border-color 0.15s ease;
    }

    .product-card:hover {
        transform: translateY(-2px);
        box-shadow: 0 8px 20px -4px rgba(15, 23, 42, 0.08);
        border-color: #cbd5e1;
    }

    .product-image-wrap {
        width: 100%;
        aspect-ratio: 1 / 1;
        background: #f1f5f9;
        overflow: hidden;
        position: relative;
    }

    .product-image {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
    }

    .product-body {
        padding: 12px 14px 14px;
        display: flex;
        flex-direction: column;
        gap: 8px;
        flex: 1;
        justify-content: space-between;
    }

    .product-name {
        font-size: 0.92rem;
        font-weight: 600;
        color: #0f172a;
        line-height: 1.35;
    }

    .variant-select-wrap {
        display: flex;
        flex-direction: column;
        gap: 4px;
    }

    .variant-label {
        font-size: 0.72rem;
        font-weight: 600;
        color: #64748b;
        text-transform: uppercase;
        letter-spacing: 0.3px;
    }

    .variant-select {
        width: 100%;
        padding: 6px 8px;
        border: 1px solid #cbd5e1;
        border-radius: 6px;
        font-size: 0.8rem;
        color: #0f172a;
        background-color: #f8fafc;
        outline: none;
        cursor: pointer;
    }

    .variant-select:focus {
        border-color: #0f172a;
        background-color: #ffffff;
    }

    .product-footer {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-top: 2px;
    }

    .product-price {
        font-size: 1rem;
        font-weight: 700;
        color: #0f172a;
    }

    .add-btn {
        background: #0f172a;
        color: #ffffff;
        border: none;
        border-radius: 6px;
        padding: 6px 12px;
        font-size: 0.8rem;
        font-weight: 600;
        cursor: pointer;
        transition: background-color 0.15s;
    }

    .add-btn:hover {
        background: #334155;
    }

    /* Right Side Checkout Summary */
    .checkout-panel {
        background: #ffffff;
        border: 1px solid #e2e8f0;
        border-radius: 10px;
        padding: 18px;
        position: sticky;
        top: 120px;
        display: flex;
        flex-direction: column;
        max-height: calc(100vh - 140px);
    }

    .checkout-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding-bottom: 12px;
        border-bottom: 1px solid #e2e8f0;
    }

    .checkout-title {
        font-size: 1rem;
        font-weight: 700;
        color: #0f172a;
    }

    .clear-cart-btn {
        background: none;
        border: none;
        color: #64748b;
        font-size: 0.8rem;
        cursor: pointer;
        font-weight: 500;
    }

    .clear-cart-btn:hover {
        color: #dc2626;
    }

    .checkout-items {
        flex: 1;
        overflow-y: auto;
        padding: 12px 0;
        display: flex;
        flex-direction: column;
        gap: 10px;
        min-height: 180px;
    }

    .checkout-empty {
        text-align: center;
        color: #94a3b8;
        font-size: 0.86rem;
        padding: 40px 12px;
    }

    .checkout-item {
        display: flex;
        align-items: center;
        gap: 10px;
        padding-bottom: 10px;
        border-bottom: 1px solid #f1f5f9;
    }

    .checkout-item-img {
        width: 44px;
        height: 44px;
        border-radius: 6px;
        object-fit: cover;
        background: #f1f5f9;
        flex-shrink: 0;
    }

    .checkout-item-info {
        flex: 1;
        min-width: 0;
    }

    .checkout-item-name {
        font-size: 0.84rem;
        font-weight: 600;
        color: #0f172a;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
    }

    .checkout-item-variant {
        font-size: 0.74rem;
        color: #475569;
        font-weight: 500;
    }

    .checkout-item-price {
        font-size: 0.78rem;
        color: #64748b;
    }

    .checkout-qty-controls {
        display: flex;
        align-items: center;
        gap: 6px;
    }

    .qty-btn {
        width: 24px;
        height: 24px;
        border-radius: 4px;
        border: 1px solid #cbd5e1;
        background: #ffffff;
        color: #0f172a;
        font-size: 0.85rem;
        font-weight: 600;
        cursor: pointer;
        display: inline-flex;
        align-items: center;
        justify-content: center;
    }

    .qty-btn:hover {
        background: #f1f5f9;
    }

    .qty-val {
        font-size: 0.84rem;
        font-weight: 600;
        min-width: 18px;
        text-align: center;
    }

    .checkout-summary-footer {
        border-top: 1px solid #e2e8f0;
        padding-top: 14px;
        display: flex;
        flex-direction: column;
        gap: 8px;
    }

    .summary-line {
        display: flex;
        justify-content: space-between;
        font-size: 0.86rem;
        color: #475569;
    }

    .summary-total {
        display: flex;
        justify-content: space-between;
        font-size: 1.05rem;
        font-weight: 700;
        color: #0f172a;
        padding-top: 6px;
        border-top: 1px dashed #e2e8f0;
    }

    .checkout-submit-btn {
        margin-top: 8px;
        width: 100%;
        padding: 11px 16px;
        border-radius: 8px;
        border: none;
        background: #0f172a;
        color: #ffffff;
        font-size: 0.92rem;
        font-weight: 600;
        cursor: pointer;
        transition: background-color 0.15s;
    }

    .checkout-submit-btn:hover {
        background: #1e293b;
    }

    .checkout-submit-btn:disabled {
        background: #94a3b8;
        cursor: not-allowed;
    }

    .checkout-msg {
        font-size: 0.8rem;
        text-align: center;
        color: #047857;
        background: #ecfdf5;
        padding: 8px;
        border-radius: 6px;
        display: none;
    }
</style>

<div class="pos-layout">
    <!-- Left: Product Cards Grid -->
    <div class="products-grid">
        {% for item in products %}
        <div
            class="product-card"
            data-id="{{ item.id }}"
            data-name="{{ item.name }}"
            data-price="{{ item.selling_price }}"
            data-image="{{ item.image_url|default:'https://images.unsplash.com/photo-1596462502278-27bfdc403348?auto=format&fit=crop&w=600&q=80' }}"
        >
            <div class="product-image-wrap">
                <img
                    src="{{ item.image_url|default:'https://images.unsplash.com/photo-1596462502278-27bfdc403348?auto=format&fit=crop&w=600&q=80' }}"
                    alt="{{ item.name }}"
                    class="product-image"
                >
            </div>
            <div class="product-body">
                <div class="product-name">{{ item.name }}</div>

                <div class="variant-select-wrap">
                    <label class="variant-label">Choose Variant</label>
                    <select class="variant-select js-variant-select">
                        {% for v in item.variant_list %}
                            <option value="{{ v }}">{{ v }}</option>
                        {% endfor %}
                    </select>
                </div>

                <div class="product-footer">
                    <span class="product-price">&#8369;{{ item.selling_price }}</span>
                    <button type="button" class="add-btn js-add-btn">+ Add</button>
                </div>
            </div>
        </div>
        {% empty %}
        <div class="card" style="grid-column: 1 / -1; text-align: center; padding: 36px;">
            <h2>No products in this category</h2>
            <p>Select another filter above to view cosmetics items.</p>
        </div>
        {% endfor %}
    </div>

    <!-- Right: Checkout Summary Panel -->
    <aside class="checkout-panel">
        <div class="checkout-header">
            <span class="checkout-title">Checkout Summary</span>
            <button type="button" class="clear-cart-btn" id="clearCartBtn">Clear</button>
        </div>

        <div class="checkout-items" id="checkoutItemsContainer">
            <div class="checkout-empty">Choose a variant and click "+ Add" on a product card.</div>
        </div>

        <div class="checkout-summary-footer">
            <div class="summary-line">
                <span>Total Items</span>
                <span id="summaryItemCount">0</span>
            </div>
            <div class="summary-total">
                <span>Total</span>
                <span id="summaryTotalAmount">&#8369;0.00</span>
            </div>

            <div class="checkout-msg" id="checkoutSuccessMsg">Checkout completed!</div>

            <button type="button" class="checkout-submit-btn" id="checkoutSubmitBtn" disabled>
                Checkout
            </button>
        </div>
    </aside>
</div>

<script>
document.addEventListener('DOMContentLoaded', function () {
    const STORAGE_KEY = 'bb_cosmetics_cart_v2';
    const itemsContainer = document.getElementById('checkoutItemsContainer');
    const itemCountEl = document.getElementById('summaryItemCount');
    const totalAmountEl = document.getElementById('summaryTotalAmount');
    const clearBtn = document.getElementById('clearCartBtn');
    const submitBtn = document.getElementById('checkoutSubmitBtn');
    const successMsg = document.getElementById('checkoutSuccessMsg');

    let cart = [];
    try {
        cart = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
    } catch (e) {
        cart = [];
    }

    function saveCart() {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(cart));
        renderCart();
    }

    function escapeHtml(str) {
        const div = document.createElement('div');
        div.textContent = str;
        return div.innerHTML;
    }

    function renderCart() {
        if (!cart.length) {
            itemsContainer.innerHTML = '<div class="checkout-empty">Choose a variant and click "+ Add" on a product card.</div>';
            itemCountEl.textContent = '0';
            totalAmountEl.innerHTML = '&#8369;0.00';
            submitBtn.disabled = true;
            return;
        }

        let totalQty = 0;
        let totalPrice = 0;

        itemsContainer.innerHTML = cart.map(function (item, idx) {
            const lineTotal = item.price * item.qty;
            totalQty += item.qty;
            totalPrice += lineTotal;
            return (
                '<div class="checkout-item">' +
                    '<img src="' + escapeHtml(item.image) + '" alt="" class="checkout-item-img">' +
                    '<div class="checkout-item-info">' +
                        '<div class="checkout-item-name">' + escapeHtml(item.name) + '</div>' +
                        '<div class="checkout-item-variant">Variant: ' + escapeHtml(item.variant || 'Standard') + '</div>' +
                        '<div class="checkout-item-price">&#8369;' + item.price.toFixed(2) + ' &times; ' + item.qty + ' = <strong>&#8369;' + lineTotal.toFixed(2) + '</strong></div>' +
                    '</div>' +
                    '<div class="checkout-qty-controls">' +
                        '<button type="button" class="qty-btn" data-action="dec" data-idx="' + idx + '">&minus;</button>' +
                        '<span class="qty-val">' + item.qty + '</span>' +
                        '<button type="button" class="qty-btn" data-action="inc" data-idx="' + idx + '">+</button>' +
                    '</div>' +
                '</div>'
            );
        }).join('');

        itemCountEl.textContent = String(totalQty);
        totalAmountEl.innerHTML = '&#8369;' + totalPrice.toFixed(2);
        submitBtn.disabled = false;
    }

    document.querySelectorAll('.js-add-btn').forEach(function (btn) {
        btn.addEventListener('click', function () {
            const card = btn.closest('.product-card');
            if (!card) return;

            const id = card.getAttribute('data-id');
            const name = card.getAttribute('data-name');
            const price = parseFloat(card.getAttribute('data-price') || '0');
            const image = card.getAttribute('data-image');
            const selectEl = card.querySelector('.js-variant-select');
            const variant = selectEl ? selectEl.value : 'Standard';
            const cartKey = String(id) + '::' + String(variant);

            const existing = cart.find(function (c) { return c.key === cartKey; });
            if (existing) {
                existing.qty += 1;
            } else {
                cart.push({
                    key: cartKey,
                    id: id,
                    name: name,
                    variant: variant,
                    price: price,
                    image: image,
                    qty: 1
                });
            }
            successMsg.style.display = 'none';
            saveCart();
        });
    });

    itemsContainer.addEventListener('click', function (e) {
        const btn = e.target.closest('.qty-btn');
        if (!btn) return;
        const idx = parseInt(btn.getAttribute('data-idx'), 10);
        const action = btn.getAttribute('data-action');
        if (!cart[idx]) return;

        if (action === 'inc') {
            cart[idx].qty += 1;
        } else if (action === 'dec') {
            cart[idx].qty -= 1;
            if (cart[idx].qty <= 0) {
                cart.splice(idx, 1);
            }
        }
        saveCart();
    });

    if (clearBtn) {
        clearBtn.addEventListener('click', function () {
            cart = [];
            saveCart();
        });
    }

    if (submitBtn) {
        submitBtn.addEventListener('click', function () {
            if (!cart.length) return;
            submitBtn.disabled = true;

            fetch('{% url "checkout_api" %}', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'X-CSRFToken': '{{ csrf_token }}'
                },
                body: JSON.stringify({ items: cart })
            })
            .then(function (res) { return res.json(); })
            .then(function (data) {
                if (data.ok) {
                    cart = [];
                    saveCart();
                    successMsg.textContent = 'Checkout complete! Total: \u20B1' + data.total_amount;
                    successMsg.style.display = 'block';
                } else {
                    submitBtn.disabled = false;
                }
            })
            .catch(function () {
                submitBtn.disabled = false;
            });
        });
    }

    renderCart();
});
</script>
